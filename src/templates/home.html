{% extends 'base.html' %}

{% block head %}
<script src="{{ url_for('static', filename='js/home.js') }}"></script>
{% endblock %}

{% block reload_index_button %}
<span>
    <button class="btn btn-outline-secondary" data-bs-placement="bottom" title="Обновление индекса" id="index"
            onclick="reload_indexes()">
        <i class="bi bi-arrow-repeat"></i>
    </button>
    <button class="btn btn-outline-secondary" data-bs-placement="bottom" title="Открытие папки исходных текстов"
            id="folder" data-bs-toggle="modal" data-bs-target="#uploadModal">
        <i class="bi bi-folder"></i>
    </button>
</span>
{% endblock %}

{% block content %}
<div class="container text-center mt-4" style="width: 50%; margin-top: 70px">
    <form onsubmit="send(this); return false">
        <div class="row">
            <div class="col text-start">
                <label class="fw-bold fs-2" for="textCand">Текст для проверки</label>
                <textarea id="text" name="text" class="form-control" rows="8"
                          placeholder="Введите текст или загрузите файл" style="resize: none;"></textarea>

                <input class="form-control mt-2" type="file" id="file" name="file" multiple>
            </div>
        </div>
        <div class="row justify-content-md-center">
            <button class="btn btn-secondary col-3 mt-3" type="submit">Проверить</button>
        </div>
        <div class="row justify-content-md-center">
            <div class="col">
                <textarea id="result" class="form-control mt-3 shadow-none" readonly rows="6"
                          style="resize: none;"></textarea>
            </div>
        </div>
        <div id="img" style="width: 600px" class="row justify-content-md-center mt-3 align-self-center ms-auto me-auto">
            <img src="">
        </div>
    </form>
</div>
{% endblock %}

{% block modal %}
<div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="Загрузка файла" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Загрузка файла</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form onsubmit="sendModalFiles(this); return false">
                <div class="modal-body">
                    <label for="indexFile" class="form-label">Файл(ы) для обновления индекса:</label>
                    <input class="form-control" type="file" id="indexFile" name="indexFile" accept=".docx,text/plain,application/pdf" multiple="multiple">
                </div>
                <div class="modal-footer">
                    <button id="submitIndexFile" type="submit" class="btn btn-primary">Загрузить</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
